[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandworm-workflow-guard"
version = "0.1.0"
description = "Offline zizmor audits with constrained workers, Thai guidance and sanitized baseline reports"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
sandworm-workflow-guard = "guard:main"

[tool.setuptools]
py-modules = ["guard", "guard_safeio"]
